spring.application.name=civicdesk

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/civicdesk_SR_IAM?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Keep names exactly as declared: table names are snake_case via @Table(name=...),
# column names stay camelCase as declared on the fields (no snake_case conversion).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
app.jwt.secret=civicdesk_hs256_secret_key_minimum_32_characters_required
app.jwt.expiry=1800000

# CORS - allowed frontend origins (comma-separated)
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173

# Audit-log service base URL — used by AuditClient for the over-HTTP POST /audit/auditLogs.
# Same app today; point this at the standalone audit service once it is split out.
app.audit.base-url=http://localhost:8081/civicDesk

# Default ADM account seeded on startup (override via env vars in real environments).
app.admin.email=${ADMIN_EMAIL:admin@civicdesk.gov}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:9999999999}

# --- File uploads (Service Request documents) ---
civicdesk.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8081
server.servlet.context-path=/civicDesk
