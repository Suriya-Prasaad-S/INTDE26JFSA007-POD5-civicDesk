spring.application.name=civicdesk

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/civicdesk?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JWT ---
app.jwt.secret=civicdesk_hs256_secret_key_minimum_32_characters_required
app.jwt.expiry=1800000

# CORS - allowed frontend origins (comma-separated)
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173

# Audit-log service base URL — used by AuditClient for the over-HTTP POST /audit/auditLogs.
# Same app today; point this at the standalone audit service once it is split out.
app.audit.base-url=http://localhost:8081/civicDesk

# --- Default admin seeded by DataSeeder on startup ---
# Each value is read from an OS environment variable, with a local-dev default
# after the colon. Export ADMIN_* in real environments to override.
app.admin.email=${ADMIN_EMAIL:admin@civicdesk.gov}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:9999999999}

# --- Server ---
server.port=8081
# Routing scheme: every endpoint is served under /civicDesk, and each controller
# adds its own module segment -> IAM uses /iam/..., grievance uses /grievance/...,
# citizen uses /citizenProfile/...
server.servlet.context-path=/civicDesk

# --- File uploads (citizen documents) ---
# Spring's defaults (1 MB) are below the citizen module's 2 MB document limit, so a
# 1-2 MB upload would be rejected with 413 before reaching DocumentService. Lift the
# servlet caps to match the service-enforced limit.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
