# ============================================================
#  Base test configuration (loaded for every test). Runs the whole
#  merged app — IAM + Service Request — against an in-memory H2.
#
#  IAM's integration/@SpringBootTest tests additionally activate the
#  "test" profile (application-test.properties), which overrides the
#  datasource/dialect/context-path. The app.* values below are needed
#  by the full application context (DataSeeder, JwtConfig, CorsConfig,
#  AuditClient) regardless of profile.
# ============================================================

# --- Database (in-memory H2) ---
spring.datasource.url=jdbc:h2:mem:civicdesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Keep identifiers exactly as declared (snake_case tables, camelCase columns), matching prod.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JWT ---
app.jwt.secret=test_secret_key_minimum_32_characters_ok
app.jwt.expiry=1800000

# --- CORS ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173

# --- Audit-log service base URL ---
app.audit.base-url=http://localhost:8081/civicDesk

# --- Default ADM account seeded on startup (matches the integration tests' credentials) ---
app.admin.email=admin@civicdesk.gov
app.admin.password=Admin@12345
app.admin.name=System Administrator
app.admin.phone=9999999999

# --- File uploads (kept inside target/ so they are cleaned by mvn clean) ---
civicdesk.uploads.dir=./target/test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MockMvc dispatches at the servlet root; keep context-path empty in tests so
# test URLs are the controller-relative paths (e.g. /serviceRequest/...).
server.servlet.context-path=
